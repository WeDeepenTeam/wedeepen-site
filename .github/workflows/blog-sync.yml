# Rebuild /blog/ whenever article data changes.
#
# WeDeepen now writes its own articles (the daily in-house pipeline commits one
# new entry to blog/data/own-articles.json). This job renders blog/ plus the
# /blog/ entries in sitemap.xml from blog/data/articles.json (the frozen
# BabyLoveGrowth archive) and blog/data/own-articles.json, refreshes the
# "Related reading" links on the podcast episode pages, rebuilds llms-full.txt,
# commits the result to main, pings IndexNow and requests a Pages build.
#
# The BabyLoveGrowth API sync is retired: no BLG_API_KEY is passed, so
# scripts/build-blog.mjs only renders. To pull from BabyLoveGrowth again, add
# `BLG_API_KEY: ${{ secrets.BLG_API_KEY }}` back to the build step's env.
name: Blog build

on:
  push:
    branches: [main]
    paths:
      - 'blog/data/**'
      - 'scripts/build-blog.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: blog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the blog
        run: node scripts/build-blog.mjs

      # Episode pages carry a "Related reading" block picked from the blog, so
      # a new article can change which posts they link to.
      - name: Refresh the episode pages' related reading
        run: |
          python3 podcast/data/generate_episode_pages.py
          node scripts/build-nav.mjs

      - name: Rebuild llms-full.txt
        run: node scripts/build-llms-full.mjs

      - name: Check the nav is still in sync
        run: node scripts/build-nav.mjs --check

      - name: Commit and push if anything changed
        id: commit
        run: |
          git add blog images/blog sitemap.xml llms-full.txt deepen-with-christina
          if git diff --cached --quiet; then
            echo "No new or changed articles."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "blog: rebuild pages from article data"
          # main moves often; replay on top of it rather than fail the push.
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep 5
          done
          if [ "$pushed" != true ]; then echo "::error::Could not push the blog update to main."; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Tell IndexNow what changed
        if: steps.commit.outputs.changed == 'true'
        run: node scripts/indexnow.mjs $(git diff --name-only HEAD~1 HEAD)

      # Pushes made with GITHUB_TOKEN don't start a Pages build on their own.
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
