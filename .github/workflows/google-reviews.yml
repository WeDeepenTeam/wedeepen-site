# Pull new Google reviews onto /reviews/ every day.
#
# Runs scripts/reviews/sync-google.mjs (Google Business Profile API) and
# scripts/build-reviews.mjs, then commits to main and requests a Pages build
# if anything changed. Until the GBP_* secrets exist the sync prints a notice
# and the run stays green. Setup: scripts/reviews/README.md.
name: Google reviews

on:
  schedule:
    - cron: '17 13 * * *'   # daily, ~8 AM Central
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: google-reviews
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pull reviews from Google
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
        run: node scripts/reviews/sync-google.mjs

      - name: Re-render /reviews/
        run: node scripts/build-reviews.mjs

      - name: Commit and push if anything changed
        id: commit
        run: |
          git add reviews
          if git diff --cached --quiet; then
            echo "No new reviews."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "reviews: sync from Google"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep 5
          done
          if [ "$pushed" != true ]; then echo "::error::Could not push the review update to main."; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Tell IndexNow
        if: steps.commit.outputs.changed == 'true'
        run: node scripts/indexnow.mjs reviews/index.html

      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
