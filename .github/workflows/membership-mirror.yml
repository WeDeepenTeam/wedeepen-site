# Keep /membership/ an exact copy of the homepage.
#
# Ads send traffic to /membership/ so it can be measured separately, but the
# page is the homepage. Whenever index.html changes on main, this rebuilds
# membership/index.html (scripts/build-membership.mjs) and commits it.
name: Membership mirror

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/build-membership.mjs
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: membership-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild /membership/ from the homepage
        run: |
          node scripts/build-membership.mjs
          node scripts/build-nav.mjs

      - name: Commit and push if it changed
        id: commit
        run: |
          git add membership/index.html
          if git diff --cached --quiet; then
            echo "Already in sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "membership: mirror homepage changes"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
            sleep 5
          done
          if [ "$pushed" != true ]; then echo "::error::Could not push the membership mirror."; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't start a Pages build on their own.
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
