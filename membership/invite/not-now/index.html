<head>

  <style>
    :root { --ink:#1A1A1A; --gold:#C9A277; --rose:#C4577A; }

<body>
  <main>
    <img src="/images/deepen-icon-favicon-white.png" width="500" height="500" alt="DEEPEN">

  </main>
